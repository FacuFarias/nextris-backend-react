version: '3.8'
services:
  nextris_app:
    container_name: nextris_app
    restart: always
    env_file: .env
    build: .
    ports:
      - "8000:5005"   # HOST:CONTENEDOR
    networks:
      - db_network
      - web_network
networks:
  db_network:
    driver: bridge
  web_network:
    driver: bridge
