<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NextRIS - Login React</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #root {
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div id="root">Cargando...</div>

    <!-- React desde CDN para desarrollo rápido -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
        const { useState } = React;

        function LoginForm() {
            const [username, setUsername] = useState('');
            const [password, setPassword] = useState('');
            const [userType, setUserType] = useState('staff'); // 'staff' o 'patient'
            const [error, setError] = useState('');
            const [loading, setLoading] = useState(false);

            const handleSubmit = async (e) => {
                e.preventDefault();
                setError('');
                setLoading(true);

                try {
                    // Crear FormData (Flask espera application/x-www-form-urlencoded)
                    const formData = new URLSearchParams();
                    formData.append('username', username);
                    formData.append('password', password);
                    formData.append('login', '1');
                    
                    if (userType === 'patient') {
                        formData.append('user_type', 'patient');
                    }

                    // Hacer POST al endpoint de Flask
                    const response = await fetch('/login', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/x-www-form-urlencoded',
                        },
                        body: formData.toString(),
                        credentials: 'include', // IMPORTANTE: para recibir/enviar cookies
                        redirect: 'manual' // No seguir redirects automáticamente
                    });

                    // Flask redirige con 302 cuando el login es exitoso
                    if (response.type === 'opaqueredirect' || response.status === 302 || response.status === 0) {
                        // Login exitoso - redirigir a la app principal
                        window.location.href = '/index';
                    } else if (response.ok) {
                        // Verificar si hay mensaje de error en la respuesta HTML
                        const html = await response.text();
                        if (html.includes('Usuario o contraseña incorrectos') || 
                            html.includes('Usuario inactivo')) {
                            setError('Credenciales incorrectas o usuario inactivo');
                        } else {
                            // Login exitoso pero sin redirect
                            window.location.href = '/index';
                        }
                    } else {
                        setError('Error en el servidor. Intenta nuevamente.');
                    }
                } catch (err) {
                    console.error('Error en login:', err);
                    setError('Error de conexión. Verifica que el servidor esté activo.');
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div style={{
                    background: 'white',
                    borderRadius: '12px',
                    padding: '40px',
                    boxShadow: '0 20px 60px rgba(0,0,0,0.3)'
                }}>
                    <div style={{ textAlign: 'center', marginBottom: '30px' }}>
                        <h1 style={{ 
                            color: '#667eea', 
                            fontSize: '32px',
                            fontWeight: '700',
                            marginBottom: '10px'
                        }}>
                            NextRIS
                        </h1>
                        <p style={{ color: '#666', fontSize: '14px' }}>
                            Iniciar Sesión
                        </p>
                    </div>

                    {error && (
                        <div style={{
                            background: '#fee',
                            border: '1px solid #fcc',
                            borderRadius: '6px',
                            padding: '12px',
                            marginBottom: '20px',
                            color: '#c33',
                            fontSize: '14px'
                        }}>
                            {error}
                        </div>
                    )}

                    <form onSubmit={handleSubmit}>
                        {/* Selector de tipo de usuario */}
                        <div style={{ marginBottom: '20px' }}>
                            <label style={{
                                display: 'flex',
                                alignItems: 'center',
                                gap: '10px',
                                cursor: 'pointer',
                                marginBottom: '10px'
                            }}>
                                <input
                                    type="radio"
                                    name="userType"
                                    value="staff"
                                    checked={userType === 'staff'}
                                    onChange={(e) => setUserType(e.target.value)}
                                    style={{ width: '16px', height: '16px' }}
                                />
                                <span style={{ fontSize: '14px', color: '#333' }}>
                                    Personal Médico
                                </span>
                            </label>
                            <label style={{
                                display: 'flex',
                                alignItems: 'center',
                                gap: '10px',
                                cursor: 'pointer'
                            }}>
                                <input
                                    type="radio"
                                    name="userType"
                                    value="patient"
                                    checked={userType === 'patient'}
                                    onChange={(e) => setUserType(e.target.value)}
                                    style={{ width: '16px', height: '16px' }}
                                />
                                <span style={{ fontSize: '14px', color: '#333' }}>
                                    Paciente
                                </span>
                            </label>
                        </div>

                        {/* Usuario */}
                        <div style={{ marginBottom: '20px' }}>
                            <label style={{
                                display: 'block',
                                fontSize: '14px',
                                fontWeight: '500',
                                color: '#333',
                                marginBottom: '8px'
                            }}>
                                Usuario
                            </label>
                            <input
                                type="text"
                                value={username}
                                onChange={(e) => setUsername(e.target.value)}
                                required
                                autoFocus
                                style={{
                                    width: '100%',
                                    padding: '12px',
                                    border: '1px solid #ddd',
                                    borderRadius: '6px',
                                    fontSize: '14px',
                                    outline: 'none',
                                    transition: 'border 0.2s'
                                }}
                                onFocus={(e) => e.target.style.borderColor = '#667eea'}
                                onBlur={(e) => e.target.style.borderColor = '#ddd'}
                            />
                        </div>

                        {/* Contraseña */}
                        <div style={{ marginBottom: '30px' }}>
                            <label style={{
                                display: 'block',
                                fontSize: '14px',
                                fontWeight: '500',
                                color: '#333',
                                marginBottom: '8px'
                            }}>
                                Contraseña
                            </label>
                            <input
                                type="password"
                                value={password}
                                onChange={(e) => setPassword(e.target.value)}
                                required
                                style={{
                                    width: '100%',
                                    padding: '12px',
                                    border: '1px solid #ddd',
                                    borderRadius: '6px',
                                    fontSize: '14px',
                                    outline: 'none',
                                    transition: 'border 0.2s'
                                }}
                                onFocus={(e) => e.target.style.borderColor = '#667eea'}
                                onBlur={(e) => e.target.style.borderColor = '#ddd'}
                            />
                        </div>

                        {/* Botón */}
                        <button
                            type="submit"
                            disabled={loading}
                            style={{
                                width: '100%',
                                padding: '14px',
                                background: loading ? '#999' : 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)',
                                color: 'white',
                                border: 'none',
                                borderRadius: '6px',
                                fontSize: '16px',
                                fontWeight: '600',
                                cursor: loading ? 'not-allowed' : 'pointer',
                                transition: 'transform 0.1s, opacity 0.2s',
                                opacity: loading ? 0.7 : 1
                            }}
                            onMouseEnter={(e) => !loading && (e.target.style.transform = 'translateY(-2px)')}
                            onMouseLeave={(e) => e.target.style.transform = 'translateY(0)'}
                        >
                            {loading ? 'Iniciando sesión...' : 'Iniciar Sesión'}
                        </button>
                    </form>

                    <div style={{
                        textAlign: 'center',
                        marginTop: '20px',
                        fontSize: '12px',
                        color: '#999'
                    }}>
                        <a href="/login" style={{ color: '#667eea', textDecoration: 'none' }}>
                            ← Volver al login tradicional
                        </a>
                    </div>
                </div>
            );
        }

        // Renderizar la app
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<LoginForm />);
    </script>
</body>
</html>
