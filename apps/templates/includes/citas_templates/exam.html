<link rel="stylesheet" href="/static/assets/css/modern-select.css">

<div class="row" id="fill_exam">

    <style>
        /* Estilos para controlar el tamaño de la tabla de estudios */
        #fill_exam .card-tabla-estudios {
            max-height: 400px;
            overflow-y: auto;
            overflow-x: auto;
        }

        /* Header sticky con degradado */
        #fill_exam .tabla-estudios thead {
            position: sticky;
            top: 0;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.95) 0%, rgba(118, 75, 162, 0.95) 100%);
            z-index: 10;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);
        }

        #fill_exam .tabla-estudios thead th {
            color: white !important;
            font-weight: 600;
            padding: 12px 16px;
            border-bottom: none !important;
        }
    </style>

    <div class="row">
      <div class="modern-select-card">
        <div class="card-title">
          <i class="fas fa-filter"></i>
          Filtros de búsqueda
        </div>
        <div class="modern-select-grid">
          <div class="modern-select-group">
            <label for="tipo_examen" class="modern-select-label">
              <i class="fas fa-stethoscope"></i>
              Tipo de examen
            </label>
            <select id="tipo_examen" name="tipo_examen" class="modern-select">
              <option value="default">Seleccione un tipo</option>
            </select>
          </div>
          
          <div class="modern-select-group">
            <label for="parte_cuerpo" class="modern-select-label">
              <i class="fas fa-user-injured"></i>
              Partes del cuerpo
            </label>
            <select id="parte_cuerpo" name="parte_cuerpo" class="modern-select">
              <option value="default">Seleccione una parte</option>
            </select>
          </div>
        </div>
      </div>
    </div>

  <div class="row">
    <div class="col-12">
      <div class="card mb-4 shadow">
        <div class="card-header pb-0">
            <div class="row">
                <div class="col-md-4">
                    <h6>Estudios</h6>
                </div>
                <div class="col-md-8 d-flex justify-content-end">
                    <button type="button" id="seleccionar-estudio" class="btn-primary btn-primary-icon btn-save boton_est" disabled title="Agregar estudio seleccionado">
                        <i class="fa fa-plus-circle" aria-hidden="true"></i>
                    </button>
                </div>
                
            </div>
            
            
        </div>
        <div class="card-body card-tabla-estudios px-0 pt-0 pb-2">
            <table class="tabla-estudios table" id="tabla-estudios">
                <thead>
                    <tr>
                        <th>Codigo</th>
                        <th>Descripcion</th>
                        <th>Modalidad</th>
                        <th>Parte del cuerpo</th>
                        <th>Grupo</th>
                    </tr>
                </thead>
                <tbody>
                    
                </tbody>
            </table>
        </div> 
    </div>
  </div>
  </div>

  <div class="row">
    
      <div class="card mb-4 shadow">
        <div class="card-header pb-0">
            <div class="row">
                <div class="col-md-4">
                    <h6>Estudios Seleccionados</h6>
                </div>

                <div class="col-md-8 d-flex justify-content-end">
                    <button type="button" id="quitar-estudio" class="btn-primary btn-primary-icon btn-back botones" disabled title="Quitar estudio seleccionado">
                        <i class="fa fa-minus-circle" aria-hidden="true"></i>
                    </button>
                </div>
            </div>
            
            
        </div>
        
        <div class="card-body card-tabla-paciente px-0 pt-0 pb-2">
            <table class="tabla-estudios table" id="tabla-estudios-selec">
                <thead>
                    <tr>
                        <th>Codigo</th>
                        <th>Descripcion</th>
                    </tr>
                </thead>
                <tbody>

                </tbody>
            </table>
        </div> 
    </div>

  </div>

  </div>


  
</div>
