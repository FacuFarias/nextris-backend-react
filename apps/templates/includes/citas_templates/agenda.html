<div class="row">
    <div class="col-5">
      <div class="card mb-4 shadow">
        <div class="card-header pb-0">
            <div class="row">
                <div class="col-md-12">
                    <h6>Estudios</h6>
                </div>
            </div>   
        </div>
        <div class="card-body card-tabla-paciente px-0 pt-0 pb-2">
            <table class="tabla-estudios table" id="tabla-estudios-agenda">
                <thead>
                    <tr>
                        <th>Codigo</th>
                        <th>Descripcion</th>
                    </tr>
                </thead>
                <tbody>

                </tbody>
            </table>
        </div> 
    </div>   
  </div>
  <div class="col-2">
    <div class="card mb-4 shadow">
      <div class="card-header pb-0">
          <div class="row">
              <div class="col-md-12">
                  <h6>Modalidad</h6>
              </div>
          </div>   
      </div>
      <div class="card-body card-tabla-paciente">
        <div class="row">
            
            <div class="col-md-12">
                <select id="machine" name="machine">
                    <option value="any" selected>Todo</option> 
                    {% for codigo in codigos: %}
                    <option value="{{codigo[0]}}">{{codigo[0]}} </option>                                       
                    {% endfor %}
                    
                </select>
            </div>
        </div>
      </div> 
  </div>   
</div>

<div class="col-3">
    <div class="card mb-4 shadow">
      <div class="card-header pb-0">
          <div class="row">
              <div class="col-md-12">
                  <h6>Fecha deseada</h6>
              </div>
          </div>   
      </div>
      <div class="card-body card-tabla-paciente">
        <input type="date" id="wish_date" name="wish_date" min="2023-01-01" max="2024-12-31" />
      </div> 
  </div>   
</div>
<div class="col-2">
    <input type="button" value="Buscar agenda" class="btn btn-info" id="boton-buscar-agenda">
    <div id='external-events'>
        <!-- <div class='fc-event fc-h-event fc-daygrid-event fc-daygrid-block-event'>
            <div class='fc-event-main'>My Event 1</div>
        </div>   -->
    </div>
</div>
<div class="row" id="card-agenda" hidden>
    <div class="card mb-12 shadow">
        <div class="card-header pb-0">
            <div class="row">
                <div class="col-md-6">
                    <h6>Arrastra el evento donde lo requieras>></h6>
                </div>
                

            </div>   
        </div>
        <div class="card-agenda-general px-0 pt-0 pb-2">
        <div id="calendario" class="calendarioo"></div>
        
        
        </div> 
    </div>
</div>
