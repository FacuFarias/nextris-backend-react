<div class="card shadow-lg mx-2 mx-md-4 mb-4 modern-header-sheet">
  <div class="card-body py-3">
    <div class="row g-3 align-items-center">

      <div class="col-lg-3 col-md-12 col-12 d-flex align-items-center justify-content-center justify-content-md-start mb-2 mb-lg-0">
        <h6 class="mb-0 d-flex align-items-center text-white">
          <i class="fa fa-search me-2"></i> Buscar Paciente
        </h6>
      </div>

      <!-- Selector de ubicación -->
      <div class="col-lg-2 col-md-4 col-12">
        <select class="form-select form-select-lg" id="location_selector" style="background-color: rgba(255,255,255,0.95); border: 2px solid rgba(102, 126, 234, 0.3);">
          <option value="">Seleccione ubicación...</option>
        </select>
      </div>

      <div class="col-lg-4 col-md-8 col-12 d-flex align-items-center search-wrapper">
        <div class="input-group input-group-lg nr-input-group w-100 my-0">
          <input type="text" class="form-control" id="busquedaSwitch" placeholder="Buscar paciente..." disabled>
          <button class="btn-primary btn-primary-icon" type="button" id="b_search" title="Buscar" disabled>
            <i class="fa fa-search"></i>
          </button>
        </div>
      </div>

      <div class="col-lg-3 col-md-4 col-12 d-flex justify-content-center justify-content-lg-end align-items-center">
        <div class="btn-group-header">
          <button type="button" class="btn-primary btn-primary-icon btn-save" id="b_agregar_paciente_rapido" data-bs-target="#modal_np_para_cita" data-bs-toggle="modal" title="Agregar paciente rápido">
            <i class="fa fa-user-plus" aria-hidden="true"></i>
            <span>Nuevo</span>
          </button>
        </div>
      </div>

    </div>
  </div>
</div>

<div class="row">
    <div class="col-12">
        <div class="card mb-4 shadow">
        <div class="card-header pb-0">
            <div class="row">
                <div class="col-md-4">
                    <h6>Resultados</h6>
                </div>
                <div class="col-md-8 d-flex justify-content-end">
                    <button type="button" id="b_sel_pac_para_adm" class="btn-primary btn-primary-icon btn-save botones_sp" disabled patient-id="" title="Seleccionar paciente">
                        <i class="fa fa-check-circle" aria-hidden="true"></i>
                    </button>
                </div>
            </div>
        </div>
        <div class="card-body card-tabla-paciente px-0 pt-0 pb-2">
            <div class="table-responsive-custom">
                <table class="tabla-primary table" id="tabla-paciente">
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Apellido</th>
                            <th>Sexo</th>
                            <th>Fecha de nacimiento</th>
                            <th>DNI</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr class="patient-row">
                            <!-- Contenido dinámico aquí -->
                        </tr>
                    </tbody>
                </table>
            </div>
        </div> 
        </div>
    </div>
</div>
