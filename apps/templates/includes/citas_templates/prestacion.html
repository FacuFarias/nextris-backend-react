<div class="row">
    <style>
        /* Estilos para el contenedor de prestaciones */
        #conteiner_blocks_prest {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            padding: 0.5rem 0;
            max-height: calc(100vh - 350px);
            overflow-y: auto;
            overflow-x: hidden;
        }

        /* Scrollbar personalizado */
        #conteiner_blocks_prest::-webkit-scrollbar {
            width: 8px;
        }

        #conteiner_blocks_prest::-webkit-scrollbar-track {
            background: rgba(102, 126, 234, 0.05);
            border-radius: 10px;
        }

        #conteiner_blocks_prest::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.5) 0%, rgba(118, 75, 162, 0.5) 100%);
            border-radius: 10px;
        }

        #conteiner_blocks_prest::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.8) 0%, rgba(118, 75, 162, 0.8) 100%);
        }

        /* Animación para nuevas cards */
        @keyframes slideInFromTop {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        #conteiner_blocks_prest .bl_prest {
            animation: slideInFromTop 0.4s ease-out;
        }

        /* Estado vacío */
        #conteiner_blocks_prest:empty::before {
            content: "No hay prestaciones cargadas";
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 3rem;
            color: rgba(102, 126, 234, 0.5);
            font-weight: 600;
            font-size: 1.1rem;
            text-align: center;
        }
    </style>
</div>

<div id="conteiner_blocks_prest">
    <!-- Las cards de prestación se cargarán dinámicamente aquí -->
</div>
