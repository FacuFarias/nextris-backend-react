
<div class="row">
<div class="col-12">
    <div class="card mb-4 shadow px-3">
    <div class="card-header pb-0">
        <div class="row">
            <div class="col-md-4">
                <h6>Preferencias generales</h6>
            </div>
            
        </div>
        
        
    </div>
    <div class="card-body card-tabla-quasi-full px-0 pt-0 pb-2">
        <form>
            <div class="mb-3">
                <label for="idioma" class="form-label">Idioma de la interfaz</label>
                <select class="form-control" id="idioma" name="idioma">
                    <option value="es">Español</option>
                    <option value="en">Inglés</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="tema" class="form-label">Tema visual</label>
                <select class="form-control" id="tema" name="tema">
                    <option value="claro">Claro</option>
                    <option value="oscuro">Oscuro</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="notificaciones" class="form-label">Notificaciones</label>
                <select class="form-control" id="notificaciones" name="notificaciones">
                    <option value="todas">Todas</option>
                    <option value="solo-importantes">Solo importantes</option>
                    <option value="ninguna">Ninguna</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="accesibilidad" class="form-label">Accesibilidad</label>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="accesibilidad" name="accesibilidad">
                    <label class="form-check-label" for="accesibilidad">Activar modo accesible (alto contraste, fuentes grandes)</label>
                </div>
            </div>
            <button type="submit" class="btn btn-primary">Guardar preferencias</button>
        </form>
    </div> 
</div>
</div>
</div>
