<!-- ============================================ -->
<!-- ARCHIVO DE EXAMEN PARA ADMISION ESPONTANEA -->
<!-- SI VES ESTO, ESTÁS EN EL ARCHIVO CORRECTO -->
<!-- ============================================ -->

<div class="row" id="fill_exam">

    <div class="row">
      <div class="modern-select-card">
        <div class="card-title">
          <i class="fas fa-filter"></i>
          Filtros de búsqueda
        </div>
        <div class="modern-select-grid">
          <div class="modern-select-group">
            <label for="tipo_examen" class="modern-select-label">
              <i class="fas fa-stethoscope"></i>
              Tipo de examen
            </label>
            <select id="tipo_examen" name="tipo_examen" class="modern-select">
              <option value="default">Seleccione un tipo</option>
            </select>
          </div>
          
          <div class="modern-select-group">
            <label for="parte_cuerpo" class="modern-select-label">
              <i class="fas fa-user-injured"></i>
              Partes del cuerpo
            </label>
            <select id="parte_cuerpo" name="parte_cuerpo" class="modern-select">
              <option value="default">Seleccione una parte</option>
            </select>
          </div>
        </div>
      </div>
    </div>

  <div class="row">
    <!-- Columna izquierda: Tabla de estudios (col-8) -->
    <div class="col-8">
      <div class="card nr-table-card mb-4">
        <div class="card-header pb-0">
            <div class="row">
                <div class="col-md-6">
                    <h6>Estudios Disponibles</h6>
                </div>
                <div class="col-md-6 d-flex justify-content-end">
                    <button type="button" id="seleccionar-estudio" class="btn-primary btn-primary-icon btn-save boton_est" disabled title="Agregar estudio seleccionado">
                        <i class="fa fa-plus-circle" aria-hidden="true"></i>
                    </button>
                </div>
            </div>
        </div>
        
        <div class="card-body nr-table-card-body px-0 pt-0 pb-2">
            <table class="nr-table tabla-estudios table" id="tabla-estudios">
                <thead>
                    <tr>
                        <th>Codigo</th>
                        <th>Descripcion</th>
                        <th>Modalidad</th>
                        <th>Parte del cuerpo</th>
                        <th>Grupo de estudio</th>
                    </tr>
                </thead>
                <tbody>
                    
                </tbody>
            </table>
        </div> 
      </div>
    </div>

    <!-- Columna derecha: Estudio seleccionado y Equipos (col-4) -->
    <div class="col-4">
      <!-- Primera row: Estudio Seleccionado -->
      <div class="row">
        <div class="col-12">
          <div class="card nr-table-card mb-4">
            <div class="card-header pb-0">
              <h6>Estudio Seleccionado</h6>
            </div>
            <div class="card-body nr-table-card-body-sm px-3 pt-3 pb-3">
              <div id="estudio-seleccionado-info">
                <p class="text-muted text-sm mb-0">Haga clic en un estudio para seleccionarlo</p>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Segunda row: Equipos -->
      <div class="row">
        <div class="col-12">
          <div class="card nr-table-card mb-4">
            <div class="card-header pb-0">
                <div class="row">
                    <div class="col-md-6">
                        <h6>Equipos</h6>
                    </div>
                    <div class="col-md-6 d-flex justify-content-end">
                      <button type="button" id="sel-equip" class="sel_equip btn-primary btn-primary-icon btn-save botones" disabled title="Seleccionar equipo">
                          <i class="fa fa-check" aria-hidden="true"></i>
                      </button>
                  </div>
                </div>
            </div>
            
            <div class="card-body nr-table-card-body-sm px-0 pt-0 pb-2">
                <table class="nr-table table" id="tabla-equipos-p-exam">
                    <thead>
                        <tr>
                            <th>Equipo</th>
                        </tr>
                    </thead>
                    <tbody id="tbody-equipos">
    
                    </tbody>
                </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div id="cita_conteiner">
    
  </div>

  <script>
    // Manejar clic simple en la tabla de estudios para mostrar en "Estudio Seleccionado"
    document.addEventListener('DOMContentLoaded', function() {
      const tablaEstudios = document.getElementById('tabla-estudios');
      const estudiosSeleccionadosDiv = document.getElementById('estudio-seleccionado-info');
      
      if (tablaEstudios) {
        const tbody = tablaEstudios.querySelector('tbody');
        if (tbody) {
          tbody.addEventListener('click', function(e) {
            const row = e.target.closest('tr');
            if (row && row.parentElement.tagName === 'TBODY') {
              // Remover selección previa
              const filas = tbody.querySelectorAll('tr');
              filas.forEach(f => f.classList.remove('fila-seleccionada'));
              
              // Marcar la fila como seleccionada
              row.classList.add('fila-seleccionada');
              
              // Obtener datos de la fila
              const cells = row.cells;
              const codigo = cells[0]?.textContent.trim() || '';
              const descripcion = cells[1]?.textContent.trim() || '';
              const modalidad = cells[2]?.textContent.trim() || '';
              const parteCuerpo = cells[3]?.textContent.trim() || '';
              const grupo = cells[4]?.textContent.trim() || '';
              const idExam = row.getAttribute('data-id');
              
              console.log('Fila clickeada - datos:', { codigo, descripcion, idExam });
              
              // Guardar en OrderData (variable global del admision.js)
              if (typeof OrderData !== 'undefined') {
                OrderData.exam = {
                  examId: idExam,
                  title: codigo + " - " + descripcion
                };
                console.log('✓ Estudio guardado en OrderData:', OrderData.exam);
              } else {
                console.error('✗ OrderData no está definido');
              }
              
              // Mostrar el estudio en prestación (si la función existe)
              if (typeof MostrarEstudioSeleccionado === 'function') {
                MostrarEstudioSeleccionado(codigo, descripcion);
                console.log('✓ MostrarEstudioSeleccionado llamado');
              } else {
                console.warn('✗ MostrarEstudioSeleccionado no existe');
              }
              
              // Cargar equipos para este estudio (si la función existe)
              if (typeof CargarEquiposParaEstudio === 'function') {
                CargarEquiposParaEstudio(descripcion);
                console.log('✓ CargarEquiposParaEstudio llamado');
              } else {
                console.warn('✗ CargarEquiposParaEstudio no existe');
              }
              
              // Actualizar el div de estudio seleccionado
              estudiosSeleccionadosDiv.innerHTML = `
                <div class="mb-2">
                  <strong class="text-primary">Código:</strong> <span>${codigo}</span>
                </div>
                <div class="mb-2">
                  <strong class="text-primary">Descripción:</strong> <span>${descripcion}</span>
                </div>
                <div class="mb-2">
                  <strong class="text-primary">Modalidad:</strong> <span>${modalidad}</span>
                </div>
                <div class="mb-2">
                  <strong class="text-primary">Parte del cuerpo:</strong> <span>${parteCuerpo}</span>
                </div>
                <div class="mb-0">
                  <strong class="text-primary">Grupo:</strong> <span>${grupo}</span>
                </div>
              `;
              
              // Habilitar botón de seleccionar estudio
              const btnSeleccionar = document.getElementById('seleccionar-estudio');
              if (btnSeleccionar) {
                btnSeleccionar.disabled = false;
              }
            }
          });
        }
      }
    });
  </script>

  <script>
    // Función para aplicar atributos data-modalidad a las celdas de modalidad
    function aplicarModalidades() {
      const tablaEstudios = document.querySelector('#tabla-estudios tbody');
      if (tablaEstudios) {
        const filas = tablaEstudios.querySelectorAll('tr');
        filas.forEach(fila => {
          const celdaModalidad = fila.querySelector('td:nth-child(3)');
          if (celdaModalidad && celdaModalidad.textContent.trim()) {
            const modalidad = celdaModalidad.textContent.trim().toUpperCase();
            celdaModalidad.setAttribute('data-modalidad', modalidad);
            console.log('Modalidad aplicada:', modalidad, 'a celda:', celdaModalidad);
          }
        });
        console.log(`✓ Modalidades aplicadas a ${filas.length} filas`);
      }
    }

    // Aplicar modalidades cuando cargue el DOM
    document.addEventListener('DOMContentLoaded', function() {
      // Aplicar inmediatamente si hay contenido
      setTimeout(aplicarModalidades, 500);
      
      // Observar cambios en la tabla para aplicar cuando se filtren estudios
      const tablaEstudios = document.querySelector('#tabla-estudios tbody');
      if (tablaEstudios) {
        const observer = new MutationObserver(() => {
          console.log('Tabla modificada, reaplicando modalidades...');
          aplicarModalidades();
        });
        observer.observe(tablaEstudios, { childList: true, subtree: true });
        console.log('✓ Observer de modalidades activado');
      }
    });

    // También aplicar cuando cambian los filtros
    const tipoExamen = document.getElementById('tipo_examen');
    const parteCuerpo = document.getElementById('parte_cuerpo');
    
    if (tipoExamen) {
      tipoExamen.addEventListener('change', function() {
        setTimeout(aplicarModalidades, 300);
      });
    }
    
    if (parteCuerpo) {
      parteCuerpo.addEventListener('change', function() {
        setTimeout(aplicarModalidades, 300);
      });
    }
  </script>
  
</div>
