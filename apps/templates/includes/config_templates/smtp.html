<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-12 col-md-10 col-lg-8">
            <div class="card">
                <div class="card-header bg-gradient-primary text-white">
                    <h4 class="mb-0">Configuración Servidor SMTP</h4>
                </div>
                <div class="card-body">
                    <form id="smtpConfigForm">
                        <div class="mb-3">
                            <label for="smtp_server" class="form-label">Servidor SMTP</label>
                            <input type="text" class="form-control" id="smtp_server" name="smtp_server" placeholder="smtp.gmail.com" autocomplete="off" required>
                        </div>
                        <div class="mb-3">
                            <label for="smtp_port" class="form-label">Puerto SMTP</label>
                            <input type="number" class="form-control" id="smtp_port" name="smtp_port" placeholder="587" autocomplete="off" required>
                        </div>
                        <div class="mb-3">
                            <label for="smtp_user" class="form-label">Usuario SMTP</label>
                            <input type="email" class="form-control" id="smtp_user" name="smtp_user" placeholder="usuario@ejemplo.com" autocomplete="email" required>
                        </div>
                        <div class="mb-3">
                            <label for="smtp_password" class="form-label">Contraseña SMTP</label>
                            <input type="password" class="form-control" id="smtp_password" name="smtp_password" autocomplete="current-password" required>
                        </div>
                        <div class="mb-3">
                            <label for="smtp_from" class="form-label">Remitente (From)</label>
                            <input type="email" class="form-control" id="smtp_from" name="smtp_from" placeholder="noreply@ejemplo.com" autocomplete="email" required>
                        </div>
                        <div class="mb-3">
                            <label for="smtp_from_name" class="form-label">Nombre del Remitente</label>
                            <input type="text" class="form-control" id="smtp_from_name" name="smtp_from_name" placeholder="NextRIS" autocomplete="off" required>
                        </div>
                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="smtp_use_tls" name="smtp_use_tls" checked>
                            <label class="form-check-label" for="smtp_use_tls">Usar TLS/SSL</label>
                        </div>
                        <button type="submit" class="btn btn-success w-100">Guardar Configuración</button>
                    </form>
                    <div id="smtpConfigResult" class="mt-3"></div>
                </div>
            </div>
        </div>
    </div>
</div>
