<div class="row">
    <!-- Tabla de Equipos - col-8 -->
    <div class="col-md-8">
        <div class="card mb-4 shadow">
            <div class="card-header pb-0">
                <div class="row">
                    <div class="col-md-4">
                        <h6>Agendas de Equipos</h6>
                    </div>
                    <div class="col-md-8 d-flex justify-content-end">  
                        <input class="form-control" id="search_agenda" name="search_agenda" placeholder="Buscar...">
                    </div>
                </div>
            </div>
            
            <div class="card-body card-tabla-quasi-full px-0 pt-0 pb-2">
                <table class="tabla-paciente table" id="tabla-agendas">
                    <thead>
                        <tr>
                            <th>AETitle</th>
                            <th>Modalidad</th>
                            <th>IP</th>
                        </tr>
                    </thead>
                    <tbody>
                    </tbody>
                </table>
            </div> 
        </div>
    </div>

    <!-- Columna derecha con las otras dos tablas - col-4 -->
    <div class="col-md-4">
        <!-- Días de la agenda -->
        <div class="card mb-4 shadow" id="card_dias">
            <div class="card-header pb-0">
                <div class="row">
                    <div class="col-md-6">
                        <h6>Días de agenda</h6>
                    </div>
                    <div class="col-md-6 d-flex justify-content-end">
                        <button type="button" class="btn btn-nr-primary rounded-circle botones_ag" id="b_agregar_dia_equip" data-bs-toggle="modal" data-bs-target="#modal_age" style="font-size: 20px;" disabled>
                            <i class="fa fa-plus-circle" aria-hidden="true"></i>
                        </button>
                        <button type="button" class="btn btn-nr-primary rounded-circle botones_ag2" id="b_editar_dia_equip" disabled>
                            <i class="fas fa-pencil-alt" aria-hidden="true"></i>
                        </button>
                        <button type="button" class="btn btn-nr-primary rounded-circle botones_ag2 delete_b" id="b_eliminar_dia_equip" disabled>
                            <i class="fas fa-trash" aria-hidden="true"></i>
                        </button>
                    </div>
                </div>
            </div>
            
            <div class="card-body card-tabla-quasi-full px-0 pt-0 pb-2">
                <table class="tabla-paciente table" id="tabla_seg_ag_equip">
                    <thead>
                        <tr>
                            <th>Dia</th>
                            <th>Inicio</th>
                            <th>Final</th>
                        </tr>
                    </thead>
                    <tbody>
                    </tbody>
                </table>
            </div> 
        </div>

        <!-- Grupos de estudios -->
        <div class="card mb-4 shadow">
            <div class="card-header pb-0">
                <div class="row">
                    <div class="col-md-6">
                        <h6>Grupos que lee</h6>
                    </div>
                    <div class="col-md-6 d-flex justify-content-end">
                        <button type="button" class="btn btn-nr-primary rounded-circle botones_ag" id="b_agregar_grupo_equip" data-bs-toggle="modal" data-bs-target="#modal_agregar_grupo_equip" style="font-size: 20px;" disabled>
                            <i class="fa fa-plus-circle" aria-hidden="true"></i>
                        </button>
                        <button type="button" class="btn btn-nr-primary rounded-circle botones_gde delete_b" id="b_eliminar_grupo_equip" disabled>
                            <i class="fas fa-trash" aria-hidden="true"></i>
                        </button>
                    </div>
                </div>
            </div>
            <div class="card-body card-tabla-quasi-full px-0 pt-0 pb-2">
                <table class="tabla-paciente table" id="grupos_del_equipo">
                    <thead>
                        <tr>
                            <th>Grupo</th>            
                        </tr>
                    </thead>
                    <tbody>
                        
                    </tbody>
                </table>
            </div> 
        </div>
    </div>
</div>
