<!-- Modal Salas/Rooms -->
<div class="modal fade custom-modal" id="modal_rooms" tabindex="-1" data-bs-keyboard="true" aria-labelledby="exampleModalLabel" aria-hidden="false" data-bs-backdrop="true" >
    <div class="modal-dialog" z-index="-2">
        <div class="modal-content">

          <div class="modal-header">
            <h1 class="modal-title fs-5" id="exampleModalLabel">Nueva Sala</h1>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close">Cerrar</button>
          </div>

          <div class="modal-body">
            <form id="Form_rooms" method="POST" action="/agregar_room">
                <input type="hidden" name="id_room" id="id_room" >
        
                <div class="form-group row">
                    <div class="col-md-8">
                        <label for="Description_room">Descripción</label>
                        <input type="text" class="form-control" id="Description_room" name="Description_room" required>
                    </div>
                    <div class="col-md-4">
                        <label for="ExtCode_room">Codigo Externo</label>
                        <input type="text" class="form-control" id="ExtCode_room" name="ExtCode_room">
                    </div>
                </div>

                <div class="form-group row"> 
                    <div class="col-md-6">
                    <input type="checkbox" id="IsAc_room" name="IsAc_room"><label for="IsAc_room">Activo</label>
                </div>
                </div>
            
        </div>
          <div class="modal-footer">
            <button type="submit" class="btn bg-gradient-success save-changes">Guardar Sala</button>
          </form>
            <button class="btn btn-primary" data-bs-dismiss="modal">Cancelar</button>
        </div>
        </div>
      
        
    </div>
  </div>
