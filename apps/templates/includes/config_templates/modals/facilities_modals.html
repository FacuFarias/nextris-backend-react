<!-- Modal Facilities -->
<div class="modal fade custom-modal" id="modal_facility" data-bs-keyboard="true" aria-labelledby="modalFacilityLabel" aria-hidden="false" data-bs-backdrop="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-title fs-5" id="modalFacilityLabel">Nueva Facility</h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close">Cerrar</button>
            </div>
            <div class="modal-body">
                <form id="Form_facility" method="POST" action="/agregar_facility">
                    <input type="hidden" name="id_facility" id="id_facility">

                    <div class="form-group row">
                        <div class="col-md-6">
                            <label for="name_facility">Nombre <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="name_facility" name="name_facility" required>
                        </div>
                        <div class="col-md-6">
                            <label for="code_facility">Código <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="code_facility" name="code_facility" required>
                        </div>
                    </div>

                    <div class="form-group row">
                        <div class="col-md-6">
                            <label for="email_facility">Email</label>
                            <input type="email" class="form-control" id="email_facility" name="email_facility">
                        </div>
                        <div class="col-md-6">
                            <label for="contact_person_facility">Persona de Contacto</label>
                            <input type="text" class="form-control" id="contact_person_facility" name="contact_person_facility">
                        </div>
                    </div>

                    <div class="form-group row">
                        <div class="col-md-12">
                            <label for="description_facility">Descripción</label>
                            <textarea class="form-control" id="description_facility" name="description_facility" rows="2"></textarea>
                        </div>
                    </div>

                    <div class="form-group row">
                        <div class="col-md-12">
                            <label for="address_facility">Dirección</label>
                            <input type="text" class="form-control" id="address_facility" name="address_facility">
                        </div>
                    </div>

                    <div class="form-group row">
                        <div class="col-md-6">
                            <label for="city_facility">Ciudad</label>
                            <input type="text" class="form-control" id="city_facility" name="city_facility">
                        </div>
                        <div class="col-md-6">
                            <label for="country_facility">País</label>
                            <input type="text" class="form-control" id="country_facility" name="country_facility">
                        </div>
                    </div>

                    <div class="form-group row">
                        <div class="col-md-6">
                            <label for="phone_facility">Teléfono</label>
                            <input type="text" class="form-control" id="phone_facility" name="phone_facility">
                        </div>
                        <div class="col-md-6">
                            <label for="status_facility">Estado</label>
                            <select class="form-control" id="status_facility" name="status_facility">
                                <option value="Active">Activo</option>
                                <option value="Inactive">Inactivo</option>
                            </select>
                        </div>
                    </div>
            </div>
            <div class="modal-footer">
                <button type="submit" class="btn bg-gradient-success save-changes">Guardar</button>
                </form>
                <button class="btn btn-primary" data-bs-dismiss="modal">Cancelar</button>
            </div>
        </div>
    </div>
</div>
