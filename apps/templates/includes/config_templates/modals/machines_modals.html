<!-- Modal Equipos/Máquinas -->
<div class="modal fade custom-modal" id="modal_mach" tabindex="-1" data-bs-keyboard="true" aria-labelledby="exampleModalLabel" aria-hidden="false" data-bs-backdrop="true" >
    <div class="modal-dialog" z-index="-2">
        <div class="modal-content">

          <div class="modal-header">
            <h1 class="modal-title fs-5" id="exampleModalLabel">Nuevo Equipo</h1>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>

          <div class="modal-body">
            <form id="Form_mach" method="POST" action="/agregar_machine">
                <input type="hidden" name="id_mach" id="id_mach">
        
                <div class="form-group row">
                    <div class="col-md-8">
                        <label for="Description_mach">Descripción</label>
                        <input type="text" class="form-control" id="Description_mach" name="Description_mach" required>
                    </div>
                    <div class="col-md-4">
                        <label for="AETitle">AETitle</label>
                        <input type="text" class="form-control" id="AETitle" name="AETitle">
                    </div>
                </div>

                <div class="form-group row"> 
                    <div class="col-md-2">
                        <label for="s_moda">Mod</label><br>
                        <select id="s_moda" name="s_moda" required>
                        </select>
                    </div>
                </div>

                <div class="form-group row"> 
                    <div class="col-md-4">
                        <label for="equip_brand">Marca</label><br>
                        <input type="text" class="form-control" id="equip_brand" name="equip_brand">
                    </div>
                    <div class="col-md-4">
                        <label for="equip_model">Modelo</label><br>
                        <input type="text" class="form-control" id="equip_model" name="equip_model">
                    </div>
                    <div class="col-md-4">
                        <label for="equip_sn">N serie</label><br>
                        <input type="text" class="form-control" id="equip_sn" name="equip_sn">
                    </div>
                </div>

                <div class="form-group row"> 
                    <div class="col-md-6">
                        <label for="equip_ip">IP</label><br>
                        <input type="text" class="form-control" id="equip_ip" name="equip_ip">
                    </div>
                    <div class="col-md-6">
                        <label for="Ext_code_equip">Codigo Externo</label><br>
                        <input type="text" class="form-control" id="Ext_code_equip" name="Ext_code_equip">
                    </div>
                </div>
                <div class="form-group row"> 
                    <div class="col-md-6">
                    <input type="checkbox" id="IsAc_mach" name="IsAc_mach"><label for="IsAc_mach">Activo</label>
                </div>
                </div>
            
        </div>
          <div class="modal-footer">
            <button type="submit" class="btn bg-gradient-success save-changes">Guardar Equipo</button>
          </form>
            <button class="btn btn-primary" data-bs-dismiss="modal">Cancelar</button>
        </div>
        </div>
      
        
    </div>
  </div>
