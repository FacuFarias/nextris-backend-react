<!-- Modal Médicos Solicitantes -->
<div class="modal fade custom-modal" id="modal_med_sol" tabindex="-1" data-bs-keyboard="true" aria-labelledby="exampleModalLabel" aria-hidden="true" data-bs-backdrop="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-title fs-5" id="exampleModalLabel">Nuevo Medico Solicitante</h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form method="POST" action="/create_med_sol" id="Form_med_sol">
                    <input type="hidden" name="id_ms" id="id_ms">
                    
                    <div class="form-group row">
                        <div class="col-md-3">
                            <label for="description">Nombre de medico solicitante</label>
                        </div>
                        <div class="col-md-9">
                            <input type="text" class="form-control" id="description" name="description" required>
                        </div>
                    </div>

                    <div class="form-group row">
                        <div class="col-md-3">
                            <label for="phone">Telefono</label>
                        </div>
                        <div class="col-md-9">
                            <input type="text" class="form-control" id="phone" name="phone" required>
                        </div>
                    </div>

                    <div class="form-group row">
                        <div class="col-md-3">
                            <label for="mail">Mail</label>
                        </div>
                        <div class="col-md-9">
                            <input type="text" class="form-control" id="mail" name="mail" required>
                        </div>
                    </div>

                    <div class="form-group row">
                        <div class="col-md-3">
                            <label for="notes">Notas</label>
                        </div>
                        <div class="col-md-9">
                            <textarea class="form-control" id="notes" name="notes" rows="4"></textarea>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="submit" class="btn bg-gradient-success save-changes" form="Form_med_sol">Crear</button>
                <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Cancelar</button>
            </div>
        </div>
    </div>
</div>
