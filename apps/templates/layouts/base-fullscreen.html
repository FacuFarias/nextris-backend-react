  <link rel="apple-touch-icon" sizes="76x76" href="{{ config.ASSETS_ROOT }}/img/logo/logo_micro.png">
  <link rel="icon" type="image/png" href="{{ config.ASSETS_ROOT }}/img/logo/logo_micro.png">

  <title>
    {% block title %}{% endblock %} | NextRIS
  </title>

  <!--     Fonts and icons     -->
  <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,400,600,700" rel="stylesheet" />
  <!-- Nucleo Icons -->
  <link href="{{ config.ASSETS_ROOT }}/css/nucleo-icons.css" rel="stylesheet" />
  <link href="{{ config.ASSETS_ROOT }}/css/nucleo-svg.css" rel="stylesheet" />
  <!-- Font Awesome Icons -->
  <!-- <script src="https://kit.fontawesome.com/42d5adcbca.js" crossorigin="anonymous"></script> -->

  <link href="{{ config.ASSETS_ROOT }}/css/nucleo-svg.css" rel="stylesheet" />

  <link id="pagestyle" href="{{ config.ASSETS_ROOT }}/css/argon-dashboard.css?v=2.0.4" rel="stylesheet" />
  
  <!-- Modern Design System -->
  <link rel="stylesheet" href="{{ config.ASSETS_ROOT }}/css/modern-background.css" />

</head>
<body class="">
  
  {% include "includes/navigation-auth.html" %}

  {% block content %}{% endblock content %}

  {% include "includes/scripts.html" %}

  <!-- Fix para PerfectScrollbar ANTES de cargar argon-dashboard -->
  <script>
    // Wrapper para PerfectScrollbar que maneja elementos nulos
    (function() {
      if (typeof PerfectScrollbar !== 'undefined') {
        var OriginalPerfectScrollbar = PerfectScrollbar;
        window.PerfectScrollbar = function(element, options) {
          // Si el elemento no existe, no hacer nada en lugar de lanzar error
          if (!element) {
            console.warn('PerfectScrollbar: elemento no encontrado, inicialización omitida');
            return {
              update: function() {},
              destroy: function() {}
            };
          }
          return new OriginalPerfectScrollbar(element, options);
        };
        // Copiar propiedades estáticas
        for (var prop in OriginalPerfectScrollbar) {
          if (OriginalPerfectScrollbar.hasOwnProperty(prop)) {
            window.PerfectScrollbar[prop] = OriginalPerfectScrollbar[prop];
          }
        }
      }
    })();
  </script>

  <!-- Specific JS goes HERE --> 
  {% block javascripts %}{% endblock javascripts %}

  <script>
    var win = navigator.platform.indexOf('Win') > -1;
    if (win && document.querySelector('#sidenav-scrollbar')) {
      var options = {
        damping: '0.5'
      }
      Scrollbar.init(document.querySelector('#sidenav-scrollbar'), options);
    }
  </script>

  <!-- Control Center for Soft Dashboard: parallax effects, scripts for the example pages etc -->
  <script src="{{ config.ASSETS_ROOT }}/js/argon-dashboard.min.js?v=2.0.4"></script>

</body>
