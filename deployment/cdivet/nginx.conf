server {
    listen 127.0.0.1:8082;
    server_name localhost 127.0.0.1 cdivet.cloud;
    root /opt/cdivet/frontend/dist;
    index index.html;
    client_max_body_size 512m;
    location /api/ {
        proxy_pass http://127.0.0.1:5002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
    }
    # MCP is disabled for CDIVET, including already open browser tabs.
    location = /assistant-bridge { return 404; }
    location ^~ /assistant-bridge/ { return 404; }
    location /assets/ { try_files $uri =404; expires 7d; }
    location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
}

server {
    listen 80;
    listen [::]:80;
    server_name cdivet.cloud www.cdivet.cloud;
    location ^~ /.well-known/acme-challenge/ {
        root /opt/dcm4chee/nginx-ssl/certbot-webroot;
        try_files $uri =404;
    }
    location / { return 301 https://cdivet.cloud$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.cdivet.cloud;
    ssl_certificate /etc/letsencrypt/live/cdivet.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cdivet.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    location ^~ /.well-known/acme-challenge/ {
        root /opt/dcm4chee/nginx-ssl/certbot-webroot;
        try_files $uri =404;
    }
    location / { return 301 https://cdivet.cloud$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name cdivet.cloud;
    ssl_certificate /etc/letsencrypt/live/cdivet.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cdivet.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /opt/cdivet/frontend/dist;
    index index.html;
    client_max_body_size 512m;
    location ^~ /.well-known/acme-challenge/ {
        root /opt/dcm4chee/nginx-ssl/certbot-webroot;
        try_files $uri =404;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:5002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
    }
    # MCP is disabled for CDIVET, including already open browser tabs.
    location = /assistant-bridge { return 404; }
    location ^~ /assistant-bridge/ { return 404; }
    location /assets/ { try_files $uri =404; expires 7d; }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
